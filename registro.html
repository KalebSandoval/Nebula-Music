<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nébula-Regístrate</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
<header class="principal">
    <img src="imgs/cover.jpg" alt="Cover Nébula, a series of albums on outer space">
    <h1>Tu música en la nube y en tu espacio.</h1>
    <h2>Regístrate</h2>
</header>
<main>
    <form action="/crear-cuenta" method="post">
        <div>
            <label for="txt_name">
                Nombre
            </label>
            <input type="text" id="txt_name" name="name" required placeholder="Escriba su nombre completo" minlength="3" n>
        </div>
        <div>
            <label for="txt_email">E-Mail</label>
            <input type="email" id="txt_email" placeholder="correo@mail.com" required for="email">
        </div>
        <div>
            <label for="txt_password">Contraseña</label>
            <input type="password" id="txt_password" required placeholder="Ingrese su contraseña">
        </div>
        <div>
            <label for="txt_dob">Fecha de nacimiento:</label>
            <input type="date" id="txt_dob" required for="dob">
        </div>
        <div>
            <label for="txt_nickname">Nombre de usuario</label>
            <input type="text" id="txt_nickname" name="nickname" required pattern="[a-zA-Z]{3,10}-[0-9]{2,10}">
        </div>
        <div class="genre-container">
            <input type="radio" value="Hombre" id="radio-hombre" name="genre">
            <label for="radio-hombre">Hombre</label>
            <input type="radio" value="Mujer" id="radio-mujer" name="genre">
            <label for="radio-mujer">Mujer</label>
            <input type="radio" value="Prefiero no decirlo" id="radio-noDecirlo" name="genre">
            <label for="radio-noDecirlo">Prefiero no decirlo</label>
        </div>

        <div class="suscriptions-container">
            <select name="sel_suscripcion" id="susctription">
                <option value="gratis">Gratis</option>
                <option value="mensual">Mensual</option>
                <option value="anual">Anual</option>
            </select>
        </div>

        <div class="comentarios">
            <textarea name="comentarios" id="comments" cols="30" rows="10" placeholder="Ingresa tus comentarios"></textarea>
        </div>

        <div class="terms">
            <label for="chk_terms">Acepta los términos y condiciones</label>
            <input type="checkbox" name="tyc" id="chk_terms">
        </div>

        <div class="options">
            <button type="submit">Registrar</button>
            <button type="reset">Cancelar</button>
        </div>

    </form>
</main>
</body>
</html>
