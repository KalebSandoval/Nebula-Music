<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula - Regístrate</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>


<nav>
    <a class="logo" href="index.html">
        <img src="imgs/nebula-03.png" alt="Logo Nébula Music">
    </a>

    <input type="checkbox" id="menu-toggle">
    <label for="menu-toggle" class="menu-button">
        <span></span>
        <span></span>
        <span></span>
    </label>

    <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="iniciar-sesion.html">Iniciar Sesión</a></li>
        <li><a href="registro.html">Registrarse</a></li>
    </ul>
</nav>


<main class="auth-container">
    <div class="auth-card">
        <h2>Crear Cuenta</h2>
        <p>Completa tus datos para registrarte</p>

        <form action="/crear-cuenta" method="post">
            <div class="form-group">
                <label for="txt_name">Nombre Completo</label>
                <input type="text" id="txt_name" name="name" required placeholder="Escriba su nombre completo" minlength="3">
            </div>

            <div class="form-group">
                <label for="txt_email">Correo Electrónico</label>
                <input type="email" id="txt_email" name="email" required placeholder="correo@mail.com">
            </div>

            <div class="form-group">
                <label for="txt_password">Contraseña</label>
                <input type="password" id="txt_password" name="password" required placeholder="Ingrese su contraseña">
            </div>

            <div class="form-group">
                <label for="txt_nickname">Pseudónimo / Nombre de usuario</label>
                <input type="text" id="txt_nickname" name="nickname" required placeholder="usuario-123" pattern="[a-zA-Z]{3,10}-[0-9]{2,10}">
            </div>

            <div class="form-group">
                <label for="txt_dob">Fecha de nacimiento</label>
                <input type="date" id="txt_dob" name="dob" required>
            </div>

            <div class="form-group">
                <label>Género</label>
                <div class="radio-group">
                    <input type="radio" value="Femenino" id="radio-femenino" name="genre">
                    <label for="radio-femenino">Femenino</label>

                    <input type="radio" value="Masculino" id="radio-masculino" name="genre">
                    <label for="radio-masculino">Masculino</label>

                    <input type="radio" value="Otro" id="radio-otro" name="genre">
                    <label for="radio-otro">Otro</label>
                </div>
            </div>

            <div class="form-group">
                <label for="susctription">Plan de Suscripción</label>
                <select name="sel_suscripcion" id="susctription">
                    <option value="gratis">Gratis</option>
                    <option value="mensual">Mensual</option>
                    <option value="anual">Anual</option>
                </select>
            </div>

            <div class="form-group">
                <label for="comments">Comentarios</label>
                <textarea name="comentarios" id="comments" rows="4" placeholder="Ingresa tus comentarios"></textarea>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" name="tyc" id="chk_terms" required>
                    <label for="chk_terms">Acepto los términos y condiciones</label>
                </div>
            </div>

            <button type="submit" class="btn-primary">Registrar</button>
            <button type="reset" class="btn-secondary">Cancelar</button>
        </form>
    </div>
</main>


<footer>
    <p>Copyright © Nébula Music 2026. Todos los derechos reservados.</p>
</footer>

</body>
</html>
