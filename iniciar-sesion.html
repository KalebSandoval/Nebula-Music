<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nébula - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

<nav>
    <a class="logo" href="index.html">
        <img src="imgs/nebula-03.png" alt="Logo Nébula Music">
    </a>

    <input type="checkbox" id="menu-toggle">
    <label for="menu-toggle" class="menu-button">
        <span></span>
        <span></span>
        <span></span>
    </label>

    <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="iniciar-sesion.html">Iniciar Sesión</a></li>
        <li><a href="registro.html">Registrarse</a></li>
    </ul>
</nav>

<main class="auth-container">
    <div class="auth-card">
        <h2>Inicia Sesión</h2>
        <p>Ingresa tus credenciales de acceso</p>

        <form action="/autenticacion" method="post">
            <div class="form-group">
                <label for="txt_email">Correo Electrónico</label>
                <input type="email" id="txt_email" name="email" required placeholder="correo@mail.com">
            </div>

            <div class="form-group">
                <label for="txt_password">Contraseña</label>
                <input type="password" id="txt_password" name="password" required placeholder="********">
            </div>

            <button type="submit" class="btn-primary">Iniciar Sesión</button>
            <button type="reset" class="btn-secondary">Cancelar</button>

            <p>
                ¿Aún no tienes cuenta? <a href="registro.html">Regístrate</a>
            </p>
        </form>
    </div>
</main>

<footer>
    <p>Copyright © Nébula Music 2026. Todos los derechos reservados.</p>
</footer>

</body>
</html>
